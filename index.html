<!-- زر لفتح بوابة الأرواح الذكية داخل الموقع الأول -->
<button onclick="openSoulPortal()" style="
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 999;
    background: linear-gradient(135deg, #d4af37, #8a7322);
    color: #050208;
    border: none;
    border-radius: 50px;
    padding: 14px 24px;
    font-family: 'Reem Kufi', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 10px 40px rgba(212,175,55,0.6);
    transition: 0.3s;
">
    🌌 بوابة الأرواح الذكية
</button>

<!-- إطار iframe المخفي الذي سيظهر عند الضغط -->
<div id="soulPortalOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(1,1,3,0.98);
    backdrop-filter: blur(20px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
">
    <div style="
        position: relative;
        width: 100%;
        max-width: 520px;
        height: 90vh;
        max-height: 700px;
        background: transparent;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 30px 90px rgba(0,0,0,0.9);
        border: 1px solid rgba(212,175,55,0.4);
    ">
        <!-- زر الإغلاق -->
        <button onclick="closeSoulPortal()" style="
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(212,175,55,0.4);
            color: #d4af37;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        ">
            ✕
        </button>
        <!-- iframe الذي يحمل الموقع الثاني -->
        <iframe src="portal.html" style="
            width: 100%;
            height: 100%;
            border: none;
            background: #080d11;
        "></iframe>
    </div>
</div>

<script>
    function openSoulPortal() {
        document.getElementById('soulPortalOverlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
    function closeSoulPortal() {
        document.getElementById('soulPortalOverlay').style.display = 'none';
        document.body.style.overflow = '';
    }
</script>
